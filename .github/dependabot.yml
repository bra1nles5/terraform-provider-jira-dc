version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps in one PR; a major version still gets its own.
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
