name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, because new advisories appear against code that has not changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities in code the provider actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A failed check is enough; commenting would need write access to PRs.
          GITLEAKS_ENABLE_COMMENTS: false
