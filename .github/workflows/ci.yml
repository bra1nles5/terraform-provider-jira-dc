name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint, test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt and go vet run inside golangci-lint; see .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # Coverage of ./src/... merged across test packages: a block counts as covered
      # when any package's tests ran it (the resource is tested from package src).
      - name: go test with coverage
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/cover"
          go test -cover -coverpkg=./src/... ./... -args -test.gocoverdir="$RUNNER_TEMP/cover"
          go tool covdata textfmt -i="$RUNNER_TEMP/cover" -o "$RUNNER_TEMP/cover.out"
          total=$(go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ {print $3}')
          echo "coverage=${total%\%}" >> "$GITHUB_OUTPUT"
          echo "Test coverage: **$total**" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the coverage of main for the README badge. It writes to the separate
  # badges branch, so main and its protection stay untouched.
  coverage-badge:
    name: coverage badge
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update coverage.json on the badges branch
        env:
          COVERAGE: ${{ needs.check.outputs.coverage }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen
          elif awk "BEGIN { exit !($COVERAGE >= 60) }"; then color=yellow
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet --ignore-unmatch .
          fi

          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$color" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged at $COVERAGE%"
            exit 0
          fi
          git commit --quiet -m "Coverage $COVERAGE%"
          git push origin badges

  actionlint:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # The Registry publishes docs/ as it is at the release tag, so a forgotten
  # `make docs` ships stale pages. Regenerate and fail on any difference.
  docs:
    name: docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make docs

      - name: docs/ matches the schema
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "docs/ is out of date: run 'make docs' and commit the result."
            git status --porcelain docs/
            git diff docs/
            exit 1
          fi

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null .
